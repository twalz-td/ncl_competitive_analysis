
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCL Caribbean Competitive Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#EDF2F7;color:#12283A;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
:root{
  --ncl:#0C88AA;--royal:#C68A14;--princess:#8B5FC4;--celebrity:#7C899B;--msc:#1E9E72;
  --ncl-b:#2CC4E0;--royal-b:#EBB84A;--princess-b:#B98BE0;--celebrity-b:#C6D0DA;--msc-b:#3FBF8E;
  --bg:#EDF2F7;--panel:#fff;--border:#D4DEE8;--bsoft:#E5ECF3;
  --ink:#12283A;--mist:#4C6379;--faint:#6E8598;
  --str:#0F9A85;--wkn:#B07E28;--opp:#2E7BC4;--thr:#C64B4B;
}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#F4F8FB}
::-webkit-scrollbar-thumb{background:#D4DEE8;border-radius:99px}
#root{height:100%;display:flex;flex-direction:column;max-width:1300px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,0.12)}
#header{flex-shrink:0;background:#fff;border-bottom:1px solid var(--border)}
#strip{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;border-bottom:1px solid var(--bsoft)}
#hero{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 20px 8px;gap:16px;flex-wrap:wrap}
#tabnav{display:flex;gap:3px;background:#F4F8FB;border:1px solid var(--border);border-radius:12px;padding:4px;flex-shrink:0;flex-wrap:wrap}
#view{flex:1;display:flex;overflow:hidden;min-height:0}
#sidebar{width:25%;min-width:200px;border-right:1px solid var(--border);overflow-y:auto;padding:16px;background:#fff;flex-shrink:0}
#canvas{flex:1;overflow-y:auto;padding:20px;background:var(--bg);min-width:0}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 3px 14px -6px rgba(30,60,95,.13)}
.lbl{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.sec-head{margin-bottom:8px}
.cpill{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:#F4F8FB;font-size:13px;font-weight:500;color:var(--mist);cursor:pointer;transition:all .15s ease;text-align:left;font-family:'Inter',sans-serif;line-height:1.3;margin-bottom:6px}
.cpill:hover{border-color:var(--faint);color:var(--ink)}
.cpill.on{background:var(--ncl);border-color:var(--ncl);color:#fff;font-weight:600}
.cpill:disabled{opacity:.3;cursor:not-allowed;pointer-events:none}
.tabbt{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:7px 13px;border-radius:8px;cursor:pointer;border:none;background:transparent;color:var(--faint);transition:all .15s ease;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tabbt:hover{color:var(--ink)}
.tabbt.on{background:var(--ncl);color:#fff;font-weight:700}
.tab-dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7;display:inline-block;flex-shrink:0}
.sw{width:9px;height:9px;border-radius:2px;display:inline-block;flex-shrink:0}
/* SWOT quads */
.qs li{color:#0F6B5E}.qw li{color:#7A5A1E}.qo li{color:#1E5A9E}.qt li{color:#9E3030}
.qs .ql{color:#0F9A85}.qw .ql{color:#B07E28}.qo .ql{color:#2E7BC4}.qt .ql{color:#C64B4B}
.qs .gh{background:#0F9A85}.qw .gh{background:#B07E28}.qo .gh{background:#2E7BC4}.qt .gh{background:#C64B4B}
/* Gauge */
.gauge-wrap{position:relative;height:9px;border-radius:999px;background:linear-gradient(90deg,#0F9A85 0%,#B07E28 54%,#C64B4B 100%);border:1px solid var(--bsoft);margin:8px 0}
.gauge-needle{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--ncl);box-shadow:0 0 0 4px rgba(12,136,170,.15),0 4px 12px rgba(0,0,0,.15);position:absolute;top:50%;transform:translate(-50%,-50%);transition:left .5s cubic-bezier(.34,1.2,.4,1),border-color .3s ease;pointer-events:none}
.gauge-parity{position:absolute;top:-4px;bottom:-4px;left:50%;width:1px;background:rgba(18,40,58,.2)}
/* Align meter */
.align-wrap{position:relative;height:9px;border-radius:999px;background:linear-gradient(90deg,#C64B4B 0%,#B07E28 46%,#0F9A85 100%);margin:8px 0}
.align-needle{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--ncl);box-shadow:0 0 0 4px rgba(12,136,170,.15);position:absolute;top:50%;transform:translate(-50%,-50%);transition:left .5s cubic-bezier(.34,1.2,.4,1),border-color .3s ease;pointer-events:none}
/* Price band */
.pb-scale{background:linear-gradient(90deg,rgba(63,191,142,.14),rgba(75,155,224,.08) 55%,rgba(235,184,74,.16));border:1px solid var(--bsoft);border-radius:10px;height:48px;position:relative}
.pb-mark{position:absolute;top:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
/* Atlas */
.atlas-cell{border-radius:6px;transition:background .2s ease;min-height:30px}
/* Perceptual map tokens */
.map-tok{position:absolute;transform:translate(-50%,-50%);z-index:10;transition:left .5s ease-in-out,top .5s ease-in-out;overflow:visible}.tok-ring{position:absolute;inset:-11px;border-radius:50%;border:1.5px solid currentColor;opacity:.38;pointer-events:none}
.tok-dot{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#0F172A;letter-spacing:.02em;user-select:none;position:relative;z-index:1}
/* Sidebar dividers */
.sdiv{border-top:1px solid var(--bsoft);padding-top:14px;margin-top:6px}
/* View fade in */
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fadein{animation:fadeIn .22s ease}
/* Quad grid */
.quad-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bsoft)}
.quad-cell{background:#fff;padding:10px 10px 12px}
.quad-cell ul{list-style:none;margin-top:6px}
.quad-cell li{font-size:12px;padding-left:10px;position:relative;margin-bottom:5px;line-height:1.4}
.quad-cell li::before{content:'';position:absolute;left:0;top:6px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5}
.ql-row{display:flex;align-items:center;gap:6px}
.gh{width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
</style>
</head>

function pill(label,active,onclick,color,subs,disabled){

function quadCell(type,items){
  const meta={s:{l:'Strengths',g:'+'},w:{l:'Weaknesses',g:'\u2013'},o:{l:'Opportunities',g:'\u2197'},t:{l:'Threats',g:'\u26a0'}};

function buildSandboxMap(){
  const xd=AXES[S.xAxis],yd=AXES[S.yAxis];
  const toL=s=>50+s*4,toT=s=>50-s*4;
  // SVG rings+grid — slightly more visible
  const rings='';
  const gv=[-8,-6,-4,-2,2,4,6,8].map(v=>`<line x1="${toL(v)}" y1="3" x2="${toL(v)}" y2="97" stroke="rgba(255,255,255,0.05)" stroke-width="0.2"/>`).join('');
  const gh=[-8,-6,-4,-2,2,4,6,8].map(v=>`<line x1="3" y1="${toT(v)}" x2="97" y2="${toT(v)}" stroke="rgba(255,255,255,0.05)" stroke-width="0.2"/>`).join('');
  // Axis label pills along center lines
  const axPills=`
    <div id="ax-xl" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#0C1E35;text-transform:uppercase;letter-spacing:.1em;background:#fff;border-radius:7px;padding:6px 12px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.2);z-index:25">\u2190 ${xd.l.toUpperCase()}</div>
    <div id="ax-xr" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#0C1E35;text-transform:uppercase;letter-spacing:.1em;background:#fff;border-radius:7px;padding:6px 12px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.2);z-index:25">${xd.r.toUpperCase()} \u2192</div>
    <div id="ax-yt" style="position:absolute;top:14px;left:50%;transform:translateX(-50%);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#0C1E35;text-transform:uppercase;letter-spacing:.1em;background:#fff;border-radius:7px;padding:6px 12px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.2);z-index:25">\u2191 ${yd.r.toUpperCase()}</div>
    <div id="ax-yb" style="position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#0C1E35;text-transform:uppercase;letter-spacing:.1em;background:#fff;border-radius:7px;padding:6px 12px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.2);z-index:25">\u2193 ${yd.l.toUpperCase()}</div>`;
  // Determine NCL quadrant (tl/tr/bl/br)
  const nclX=xd.s.ncl,nclY=yd.s.ncl;
  const nclQ=(nclY>=0?'t':'b')+(nclX>=0?'r':'l');
  // Build quadrant name labels + NCL highlight
  const qNames=getQuadrantNames(S.xAxis,S.yAxis);
  const quadPositions={
    tl:{left:'3%',  top:'6%',    anchor:'left'},
    tr:{right:'3%', top:'6%',    anchor:'right'},
    bl:{left:'3%',  bottom:'6%', anchor:'left'},
    br:{right:'3%', bottom:'6%', anchor:'right'}
  };
  const qlabels=['tl','tr','bl','br'].map(q=>{
    const isNcl=q===nclQ;
    const pos=quadPositions[q];
    const posStyle=pos.bottom!==undefined
      ? (pos.anchor==='right'?`right:${pos.right};bottom:${pos.bottom}`:`left:${pos.left};bottom:${pos.bottom}`)
      : (pos.anchor==='right'?`right:${pos.right};top:${pos.top}`:`left:${pos.left};top:${pos.top}`);
    return `<div id="qlabel-${q}" style="position:absolute;${posStyle};pointer-events:none;text-align:${pos.anchor};z-index:20;max-width:26%">
      <div style="font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:${isNcl?'rgba(255,255,255,0.95)':'rgba(255,255,255,0.45)'};line-height:1.4;letter-spacing:0.01em;${isNcl?'text-shadow:0 0 20px rgba(44,196,224,0.6)':''}">${qNames[q]}</div>
    </div>`;
  }).join('');
  // Tokens
  const toks=LK.map(l=>{
    const col=BRIGHT[l];
    return `<div id="tok-${l}" class="map-tok" style="left:${toL(xd.s[l])}%;top:${toT(yd.s[l])}%">
      <div class="tok-ring" style="color:${col};inset:-14px"></div>
      <div class="tok-dot" style="background:${col};box-shadow:0 0 36px ${col}99,0 0 14px ${col}66;width:64px;height:64px"></div>
      <div style="position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:rgba(255,255,255,0.92);background:rgba(15,35,60,0.88);border:1px solid rgba(44,196,224,0.25);border-radius:5px;padding:4px 10px;pointer-events:none;letter-spacing:.01em">${LN[l]}</div>
    </div>`;
  }).join('');
  g('canvas').innerHTML=`
    <div class="fadein">
    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">
      <div class="card" id="chip-x" style="padding:8px 14px;font-size:12px;display:flex;align-items:center;gap:8px"><span class="lbl">X \u2192</span><b>${S.xAxis}</b><span style="color:var(--faint);font-size:10px">${xd.l} \u2194 ${xd.r}</span></div>
      <div class="card" id="chip-y" style="padding:8px 14px;font-size:12px;display:flex;align-items:center;gap:8px"><span class="lbl">Y \u2191</span><b>${S.yAxis}</b><span style="color:var(--faint);font-size:10px">${yd.l} \u2194 ${yd.r}</span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:0;margin-bottom:16px">
      <div style="display:flex;gap:0">
        <!-- Y axis bar (west side) -->
        <div id="ybar" style="width:44px;flex-shrink:0;background:rgba(44,196,224,0.25);border-radius:10px 0 0 0;display:flex;align-items:center;justify-content:center;border:1px solid rgba(44,196,224,0.5);border-right:none;border-bottom:none">
          <span style="font-family:'Space Mono',monospace;font-size:15px;font-weight:700;color:#0C1E35;text-transform:uppercase;letter-spacing:.18em;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap">${S.yAxis}</span>
        </div>
        <!-- Map -->
        <div style="position:relative;background:#1a3a5c;border-radius:0 16px 16px 0;aspect-ratio:4/3;flex:1;overflow:visible;box-shadow:0 8px 32px rgba(12,30,53,0.25),0 0 0 1px rgba(12,136,170,0.2)">
          <div style="position:absolute;inset:0;border-radius:0 16px 16px 16px;overflow:hidden;background:linear-gradient(145deg,#1e4268 0%,#1a3a5c 60%,#162f4d 100%)">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">${rings}${gv}${gh}<line x1="50" y1="3" x2="50" y2="97" stroke="rgba(44,196,224,0.18)" stroke-width="0.35" stroke-dasharray="1 0.6"/><line x1="3" y1="50" x2="97" y2="50" stroke="rgba(44,196,224,0.18)" stroke-width="0.35" stroke-dasharray="1 0.6"/></svg>
            ${axPills}
          </div>
          ${qlabels}
          ${toks}
        </div>
      </div>
      <!-- X axis bar (south side) -->
      <div style="display:flex">
        <div style="width:44px;flex-shrink:0;background:rgba(44,196,224,0.25);border-radius:0 0 0 10px;border:1px solid rgba(44,196,224,0.5);border-top:none;border-right:none"></div>
        <div id="xbar" style="flex:1;height:44px;background:rgba(44,196,224,0.25);border-radius:0 0 10px 0;display:flex;align-items:center;justify-content:center;border:1px solid rgba(44,196,224,0.5);border-top:none;border-left:none">
          <span style="font-family:'Space Mono',monospace;font-size:15px;font-weight:700;color:#0C1E35;text-transform:uppercase;letter-spacing:.18em;white-space:nowrap">${S.xAxis}</span>
        </div>
      </div>
    </div>
    <div class="card" id="sandbox-take" style="padding:18px;border-left:3px solid var(--ncl)">
      <div class="lbl" style="margin-bottom:6px">Executive Takeaway</div>
      <p style="font-size:13.5px;color:var(--ink);line-height:1.6">${STAKES[S.xAxis]}</p>
    </div>
    <p style="font-size:11px;color:var(--faint);margin-top:8px">Axis scores are MMGY\u2019s directional assessment (scale \u221210 to +10). Designed to prompt discussion, not define fact.</p>
    </div>`;
}

function updateSandboxMap(){
  const xd=AXES[S.xAxis],yd=AXES[S.yAxis];
  const toL=s=>50+s*4,toT=s=>50-s*4;
  // Update token positions
  LK.forEach(l=>{
    const t=g(`tok-${l}`);
    if(t){t.style.left=`${toL(xd.s[l])}%`;t.style.top=`${toT(yd.s[l])}%`;}
    const sc=g(`sc-${l}`);
    if(sc)sc.textContent=`x:${xd.s[l]} / y:${yd.s[l]}`;
  });
  // Update quadrant labels + NCL highlight
  const nclQ=(yd.s.ncl>=0?'t':'b')+(xd.s.ncl>=0?'r':'l');
  const qNames=getQuadrantNames(S.xAxis,S.yAxis);
  const quadAligns={tl:'left',tr:'right',bl:'left',br:'right'};
  ['tl','tr','bl','br'].forEach(q=>{
    const el=g(`qlabel-${q}`);
    if(!el)return;
    const isNcl=q===nclQ;
    el.style.textAlign=quadAligns[q];
    el.innerHTML=`<div style="font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:${isNcl?'rgba(255,255,255,0.95)':'rgba(255,255,255,0.45)'};line-height:1.4;letter-spacing:0.01em;${isNcl?'text-shadow:0 0 20px rgba(44,196,224,0.6)':''}">${qNames[q]}</div>`;
  });
  // Update axis bars
  const ybar=g('ybar'),xbar=g('xbar');
  if(ybar)ybar.querySelector('span').textContent=S.yAxis;
  if(xbar)xbar.querySelector('span').textContent=S.xAxis;
  const xl=g('ax-xl'),xr=g('ax-xr'),yt=g('ax-yt'),yb=g('ax-yb');
  if(xl)xl.textContent=`\u2190 ${xd.l.toUpperCase()}`;
  if(xr)xr.textContent=`${xd.r.toUpperCase()} \u2192`;
  if(yt)yt.textContent=`\u2191 ${yd.r.toUpperCase()}`;
  if(yb)yb.textContent=`\u2193 ${yd.l.toUpperCase()}`;
  // Update chips
  const cx=g('chip-x'),cy=g('chip-y');
  if(cx)cx.innerHTML=`<span class="lbl">X \u2192</span><b>${S.xAxis}</b><span style="color:var(--faint);font-size:10px">${xd.l} \u2194 ${xd.r}</span>`;
  if(cy)cy.innerHTML=`<span class="lbl">Y \u2191</span><b>${S.yAxis}</b><span style="color:var(--faint);font-size:10px">${yd.l} \u2194 ${yd.r}</span>`;
  // Update takeaway
  const tk=g('sandbox-take');
  if(tk)tk.innerHTML=`<div class="lbl" style="margin-bottom:6px">Executive Takeaway</div><p style="font-size:13.5px;color:var(--ink);line-height:1.6">${STAKES[S.xAxis]}</p>`;
}

/* ================================================================
   STATE ACTIONS
================================================================ */
function switchTab(t){S.tab=t;renderHeader();renderTab();}
function setFoe(v){S.foe=v;renderSwotSidebar();renderSwotCanvas();}
function setLens(v){S.lens=v;renderSwotSidebar();renderSwotCanvas();}
function setSeason(v){S.season=v;renderAtlasSidebar();renderAtlasCanvas();}
function setRegion(v){S.region=v;renderAtlasSidebar();renderAtlasCanvas();}
function setSel(v){S.sel=v;renderBrandSidebar();renderBrandCanvas();}
function setXAxis(v){S.xAxis=v;if(S.yAxis===v){S.yAxis=AK.find(a=>a!==v);}renderSandboxSidebar();updateSandboxMap();}
function setYAxis(v){S.yAxis=v;renderSandboxSidebar();updateSandboxMap();}

function renderTab(){
  if(S.tab==='swot'){renderSwotSidebar();renderSwotCanvas();}
  else if(S.tab==='atlas'){renderAtlasSidebar();renderAtlasCanvas();}
  else if(S.tab==='brand'){renderBrandSidebar();renderBrandCanvas();}
  else if(S.tab==='sandbox'){renderSandboxSidebar();buildSandboxMap();}
}

/* ================================================================
   INIT
================================================================ */
renderHeader();
renderTab();
</script>
